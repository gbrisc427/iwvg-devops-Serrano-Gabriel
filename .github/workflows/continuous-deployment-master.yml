name: CD Master
on:
  push:
    branches: [master]

jobs:
  cd:
    name: Build & Push GitHub Package & Deploy on Render Docker Image
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: ⬇️ Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: 🏷️ Extract GitHub Container Registry, repository (lowercase) & version from pom
        run: |
          echo "GHCR_URL=ghcr.io" >> $GITHUB_ENV
          echo "ARTIFACT=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)" >> $GITHUB_ENV          
          echo "REPOSITORY=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV
          echo "VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)" >> $GITHUB_ENV

      # 1º Crear Token de Acceso Personal:
      #    GitHub → Settings → Developer settings → Personal access tokens → Generate new token (classic)
      #    Permisos mínimos: write:packages, read:packages, delete:packages, repo
      # 2º Crear secret en GitHub:
      #    Repo → Settings → Secrets and variables → Actions → New repository secret
      #    Name: GHCR_PERSONAL_ACCESS_TOKEN, Value: <tu token>

      - name: 📦 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PERSONAL_ACCESS_TOKEN }}

      - name: 🐳 Build & Push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.REPOSITORY }}:${{ env.VERSION }}
            ghcr.io/${{ env.REPOSITORY }}:latest

      - name: 🚀 Deploy on Lightsail (AWS)
        uses: appleboy/ssh-action@8faa84277b88b6cd1455986f459aa66cf72bc8a3 # v1.2.1
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_PERSONAL_ACCESS_TOKEN }}
          REPOSITORY: ${{ env.REPOSITORY }}
          ARTIFACT: ${{ env.ARTIFACT }}
          ACTOR: ${{ github.actor }}
        with:
          host: ${{ secrets.AWS_LIGHTSAIL_IP_MAIN }}
          username: ${{ secrets.AWS_LIGHTSAIL_USER_MAIN }}
          key: ${{ secrets.AWS_LIGHTSAIL_SSH_KEY_MAIN }}
          envs: GHCR_TOKEN, REPOSITORY, ARTIFACT, ACTOR
          script: |
            echo "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$ACTOR" --password-stdin      
            sudo docker pull ghcr.io/$REPOSITORY:latest
            sudo docker rm -f $ARTIFACT || true
            sudo docker run -d \
              --name $ARTIFACT \
              --restart always \
              --memory 512m \
              --memory-swap 1024m \
              --network devops \
              -p 10000:10000 \
              -e SPRING_PROFILES_ACTIVE=prod \
              ghcr.io/$REPOSITORY:latest

            echo "⏳ Esperando a que se levante"
            for i in $(seq 1 6); do
              sleep 15
              STATUS=$(sudo docker inspect --format='{{.State.Health.Status}}' $ARTIFACT 2>/dev/null)
              echo "Intento $i: $STATUS"
              [ "$STATUS" = "healthy" ] && break
            done

            if [ "$STATUS" != "healthy" ]; then
              echo "❌ Deploy fallido"
              sudo docker logs --tail 50 $ARTIFACT
              exit 1
            fi

            echo "✅ Deploy exitoso"
            sudo docker image prune --filter "until=12h" -f
            


